name: Ruby

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 3.2.3
          bundler-cache: true

      # Fails the build when a gem in Gemfile.lock has a known vulnerability.
      # css_parser's fixes need Ruby 3.3+; premailer only parses CSS from our
      # own email templates. Remove these ignores after the Ruby upgrade.
      - name: Audit gems for known vulnerabilities
        run: |
          gem install bundler-audit -v 0.9.3 --no-document
          bundle-audit check --update --ignore GHSA-9pmc-p236-855h GHSA-84w7-hpvm-rxx2 GHSA-w3mx-4vv9-hjpg

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install Node dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get -yqq install libpq-dev

      - name: Build App
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          RAILS_ENV: test
        run: |
          bin/rails db:setup

      - name: Enforce MCP and OAuth coverage
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          RAILS_ENV: test
          AGENT_COVERAGE: '1'
        run: bin/rails test test/functional/api/agent test/models/agent_oauth*_test.rb

      - name: Run Tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          RAILS_ENV: test
        run: |
          bundle exec rake test

      - name: Run JavaScript tests
        run: node --test test/javascript/*_test.js

      - name: Precompile production assets
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
        run: bin/rails assets:precompile
